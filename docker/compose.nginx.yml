# =============================================================
# Nginx 单入口反代（P4-D19，Q3=HTTP 先跑通）
# 入口： http://localhost:9763（用户规则 Web 应用端口基线）
# 回源： 宿主 Next.js :3000 / FastAPI :8000（host.docker.internal）
# 启动： docker compose -f docker/compose.nginx.yml up -d
# 验证： curl http://localhost:9763/api/health
# =============================================================

name: auscult-nginx

services:
  nginx:
    # 纪律1：禁裸 tag，精确 digest（nginx:1.27-alpine amd64）
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: auscult-nginx
    volumes:
      - ../configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9763:80"
    extra_hosts:
      # 容器→宿主回源（Windows Docker Desktop）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # 必须用 127.0.0.1：alpine busybox wget 会把 localhost 优先解析为 IPv6 ::1，
      # 而 nginx 仅监听 IPv4 0.0.0.0:80，用 localhost 会恒判失败（假 negative）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
