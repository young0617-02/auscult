# 高风险确定性规则（D16 · M3.4）
#
# 用途：human_review 节点用这些确定性规则（关键词/操作类型）判定诊断结论中
#       是否含高风险操作，**不依赖 LLM**。规则命中 → 需人工审核。
#
# 对应交付物：plan/Phase 3 §六.5 / §五 D16
# 安全纪律：规则只增不减；新增高风险操作须同步更新本文件 + 审计

# 高风险关键词（出现在诊断结论/建议中即命中）
high_risk_keywords:
  - 停机
  - 紧急停机
  - 立即停机
  - 高压
  - 高压作业
  - 电气
  - 电气作业
  - 动火
  - 动火作业
  - 吊装
  - 吊装作业
  - 泄漏
  - 介质泄漏
  - 爆炸
  - 火灾
  - 爆燃
  - 断电
  - 排液
  - 排空
  - 检修
  - 更换轴承
  - 更换转子
  - 更换密封

# 高风险操作类型（建议 action 中出现即命中）
high_risk_operations:
  - 停机检查
  - 停机检修
  - 紧急停机
  - 更换轴承
  - 更换转子
  - 更换密封
  - 更换叶轮
  - 高压清洗
  - 电气检修
  - 动火作业
  - 吊装作业
  - 排液排空
  - 泄漏处理
  - 整机更换
  - 解体检查

# 默认审核策略
review_policy:
  # risk_level=high 且有规则命中 → 必须审核（interrupt）
  # risk_level=high 但无规则命中 → 仍需审核（LLM 判定 high，保守起见）
  # risk_level!=high 且无规则命中 → 不审核（不进入此节点）
  always_interrupt_when_high: true
  # 审核人要求（D17 resume 时校验）
  requires_reviewer_id: true
  # 职责分离：报告提交者不得自审（D18 实现）
  submitter_cannot_self_review: true
