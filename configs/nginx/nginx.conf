# =============================================================
# Nginx 单入口反代（P4-D19，Q3=HTTP 先跑通，HTTPS 留部署期）
# 回源：宿主服务经 host.docker.internal（Next.js :3000 / FastAPI :8000）
# 关键纪律（P4-R1）：/socket.io 必须 WS 透传（Upgrade/Connection 头 + 长超时）
# =============================================================

upstream auscult_frontend {
    server host.docker.internal:3000;
}

upstream auscult_backend {
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name _;

    # 请求体上限（知识库上传占位 content 可达 200KB，留余量）
    client_max_body_size 2m;

    # ---- Socket.IO（WS 透传；必须置前于 / 通配，路径最长匹配优先虽可，显式更安全） ----
    location /socket.io/ {
        proxy_pass http://auscult_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS 长连接：关闭缓冲 + 拉长读超时（诊断 30s+，留 2 倍余量）
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://auscult_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 诊断 POST /api/diagnose 同步等待可能较慢，放宽读超时
        proxy_read_timeout 90s;
    }

    # ---- 前端（Next.js，含 _next 静态资源/HMR） ----
    location / {
        proxy_pass http://auscult_frontend;
        proxy_http_version 1.1;
        # Next dev HMR 走 WS（/_next/webpack-hmr），透传 Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HMR/WS 的 Connection 头映射（非 upgrade 时回退 close，避免逐跳头违规）
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}
