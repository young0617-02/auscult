# =============================================================
# Mosquitto MQTT Broker 配置 —— Sparkplug B 接入（V3 验证对象）
# 落地路径： configs/mosquitto.conf
# 依据： Phase 0 计划 D4–D5 / V3 Step1（Mosquitto 为默认选型，EMQX 为备选）
# 端口： 1883 (MQTT) / 9001 (WebSocket)
# =============================================================

# ---------- 网络 ----------
# 允许容器内其他组件（taosX / 模拟器）访问
listener 1883 0.0.0.0
protocol mqtt

# WebSocket 监听，便于用浏览器工具直接观测 Sparkplug 报文
listener 9001 0.0.0.0
protocol websockets

# 注意：P0 阶段使用 Docker 默认 bridge 网络即可。
#       若 .wslconfig 启用 networkingMode=mirrored，容器亦可用 127.0.0.1 互通。

# ---------- 认证 ----------
# P0 验证阶段：允许匿名，便于快速搭链路。
# ⚠️ P1 及以后必须改为密码认证 + TLS，并在此登记变更。
allow_anonymous true

# ---------- 持久化 ----------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# 保留消息（Sparkplug 的 NBIRTH/DBIRTH 依赖 retained 语义）
# Mosquitto 默认支持 retained，无需额外开关，但需保证不退化为内存-only
max_queued_messages 1000
max_inflight_messages 20

# ---------- 日志 ----------
log_dest stdout
log_type error
log_type warning
log_type notice
# 调试 Sparkplug 主题时临时把下面两行打开（量很大，平时关闭）
# log_type information
# log_type subscribe
connection_messages true
log_timestamp true

# ---------- Sparkplug B 主题结构备忘（V3 Schema 映射的输入） ----------
# spBv1.0/<group_id>/<message_type>/<edge_node_id>/<device_id>
#   message_type ∈ {NBIRTH, NDEATH, NDATA, DBIRTH, DDEATH, DDATA, STATE}
# 示例：
#   spBv1.0/PLANT-A/NBIRTH/EDGE-01
#   spBv1.0/PLANT-A/DBIRTH/EDGE-01/PUMP-A-01
#   spBv1.0/PLANT-A/DDATA/EDGE-01/PUMP-A-01
# 详见 docs/schema-mapping.md

# ---------- ACL 占位（P0 不启用，P1 启用） ----------
# acl_file /mosquitto/config/acl
# 规划：taosX 只需订阅 spBv1.0/+/# 的读权限；
#       模拟器只允许发布到 spBv1.0/PLANT-A/# 下的自己的 edge_node_id