# =============================================================
# Redis 配置 —— LangGraph Checkpoint 专用（V5 验证对象）
# 落地路径： configs/redis.conf
# 依据： Phase 0 计划 D6–D7 / V5 Step T5.7
# 启动命令： redis-server /path/to/redis.conf
#   Docker 等价： docker run -d --name redis-ckpt -p 6379:6379 \
#                  -v "$PWD/configs/redis.conf:/usr/local/etc/redis/redis.conf" \
#                  redis:8 redis-server /usr/local/etc/redis/redis.conf
# =============================================================

# ---------- 持久化：必须开 AOF ----------
# 理由：checkpoint 是"审核状态的唯一副本"，进程重启后必须能恢复。
#       RDB 快照间隔内崩溃会丢数据，因此 AOF 为必选项。
appendonly yes
appendfsync everysec

# AOF 重写：控制体积增长（对应 T5.6 体积治理）
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 关闭 RDB（避免与 AOF 双写抢占磁盘 IO 造成延迟毛刺）
save ""

# ---------- 内存策略：必须 noeviction ----------
# 理由：★ 这是 V5 的核心判据之一。
#       Redis checkpointer 存的是"不可再生数据"。若使用 allkeys-lru 等淘汰策略，
#       内存压力下 Redis 会静默删除 checkpoint，导致：
#         1) 审核中的流程无法恢复（直接违反 Pass 判据"无 TTL 丢状态"）
#         2) 恢复后状态不完整，产生错误的诊断结论
#       noeviction 的行为是：内存写满时写入报错（OOM command not allowed），
#       而不是静默丢数据 —— 失败可见，优于数据静默丢失。
maxmemory 1gb
maxmemory-policy noeviction
maxmemory-samples 5

# 内存达到上限前提前告警（对应 T5.7"内存上限告警"）
# 触发后由外部脚本采集 used_memory 并写 reports/v5-report.md
# 人工巡检命令： redis-cli info memory | grep used_memory_human
# 建议告警线 = maxmemory 的 80% = 819MB

# ---------- 不设 TTL ----------
# 理由：checkpoint 生命周期由"审核流程是否终结"决定，而不是由时间决定。
#       跨天/跨周的人工审核是正常场景，设 TTL 会导致审核中途状态消失。
# 因此：本配置中【不出现任何 EXPIRE/EXPIREAT/PEXPIRE 类指令，也不使用 volatile-* 系列的 maxmemory-policy】。
#       清理动作只能由业务流程在"审核已终结"后显式删除 key。
# 禁止：任何形式的 EXPIRE / EXPIREAT / volatile-* 策略。

# ---------- 网络与安全 ----------
# ★ 二选一（详见 docs/checkpoint-decision.md §三 与 docs/known-issues.md ISS-015）：
#   形态 A（当前生效）：宿主原生 redis-server / 本机回环访问 —— 仅监听回环，暴露面最小。
bind 127.0.0.1
protected-mode yes
#   形态 B：以 Docker 容器运行（compose.base.yml 的 redis 服务，6379:6379）时，
#   容器内仅绑回环会导致 docker-proxy 与同网段其它容器**都连不上**（且 protected-mode
#   在无 requirepass 时仍会拒绝非回环客户端）。此时须改用下面两行，并接受"无鉴权"的暴露面；
#   P1 应改为 requirepass + 客户端带密（见 ISS-015 处置项）。
# bind 0.0.0.0
# protected-mode no
port 6379
timeout 0
tcp-keepalive 300

# ---------- 日志与监控 ----------
loglevel notice
# 日志文件路径按容器/宿主环境调整；Docker 下建议留空走 stdout
# logfile ""
databases 16

# ---------- 慢查询（用于 P95 延迟分析） ----------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------- 客户端缓冲（避免多 worker 场景下连接被踢） ----------
maxclients 1000