# Prometheus 抓取配置（P5-W2/D7 · M5.2）
# Q4=B 定案：Prometheus/Grafana 压测期临时起、测后销毁（docker/compose.monitoring.yml）
# 目标：宿主 API 进程（uvicorn 127.0.0.1:8000）的 /metrics 端点
#   容器内访问宿主 → host.docker.internal（Docker Desktop WSL2 后端支持）
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: auscult-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: auscult-diagnosis-api
          env: dev

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
