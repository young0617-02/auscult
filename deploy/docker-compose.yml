# =============================================================
# Phase 6 交付统一编排（deploy/docker-compose.yml）
#
# 用途：一键启动本项目全栈基础设施（PG / Milvus / Redis / Neo4j /
#       Mosquitto / TDengine / Nginx），供干净环境验证。
#
# 端口口径（与 app/api/config.py 默认值一致）：
#   PG          5433   (root/123456/auscult_v2，ParadeDB PG18 + pgvector + pg_search)
#   Milvus gRPC 19531  (v2 业务栈，基线 19530 被 kbrag 占用而偏移)
#   Redis       6379   (密码 auscult-dev-redis)
#   Neo4j       7474/7687  (neo4j/auscult_p0_dev)
#   Mosquitto   1883/9001
#   TDengine    6030/6041  (profile: tdengine，默认不启)
#   Nginx       9763   (反向代理 → Next.js :3000 / FastAPI :8000)
#
# 镜像纪律：全部 @sha256 锚定，无裸 tag（version-lock.md §二.2.1）
#
# 启动：  docker compose -f deploy/docker-compose.yml up -d
# 停止：  docker compose -f deploy/docker-compose.yml down
# 销毁：  docker compose -f deploy/docker-compose.yml down -v
# =============================================================

name: auscult-deploy

networks:
  auscult-net:
    driver: bridge

volumes:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  pg-data:
  redis-data:
  neo4j-data:
  mosquitto-data:
  tdengine-data:

services:

  # ---------------- Milvus 依赖：etcd + minio ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.25@sha256:52f17f7e56e4f7239f0320dbfcbcc24721163d7d78ae710b466af3254ccf6366
    container_name: auscult-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd
    networks: [auscult-net]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    container_name: auscult-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus-minio-data:/minio_data
    networks: [auscult-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"

  # ---------------- 向量库：Milvus v3.0.0 ----------------
  milvus:
    image: milvusdb/milvus:v3.0.0@sha256:49371c30af46b1013e4d3e0b980e691d81376d69cdbe1b372725baf1d7255862
    container_name: auscult-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19531:19530"   # gRPC（宿主 19531 → 容器 19530，与 app/api/config.py 默认一致）
      - "9092:9091"     # metrics / healthz
    networks: [auscult-net]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"

  # ---------------- 关系库：ParadeDB (PG18 + pgvector + pg_search) ----------------
  postgres:
    image: paradedb/paradedb@sha256:188591a0bc317beb2c6d6d3f9ef0cb3e859d09ecc15a71dda5e9a027876686cf
    container_name: auscult-pg
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=auscult_v2
    volumes:
      # PG18 数据目录布局：挂载点必须为 /var/lib/postgresql
      - pg-data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks: [auscult-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d auscult_v2"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  # ---------------- 状态库：Redis 8（LangGraph checkpoint + 限流 + 去重） ----------------
  redis:
    image: redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    container_name: auscult-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      # 相对路径以 compose 文件所在目录(deploy/)为准，../configs 指向项目根 configs/
      - ../configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [auscult-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "0.5"

  # ---------------- 图数据库：Neo4j 5 社区版 ----------------
  neo4j:
    image: neo4j:5-community@sha256:ab3aafb0020e6fed65bb2b59f7db1fabd7ee0568c4da46f3cc3b8fad77801d61
    container_name: auscult-neo4j
    environment:
      - NEO4J_AUTH=neo4j/auscult_p0_dev
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    networks: [auscult-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"

  # ---------------- MQTT Broker：Mosquitto 2 ----------------
  mosquitto:
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    container_name: auscult-mosquitto
    volumes:
      - ../configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    networks: [auscult-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ---------------- 时序库：TDengine 3.3.8.0（profile: tdengine，默认不启） ----------------
  tdengine:
    image: tdengine/tsdb:3.3.8.0@sha256:36e2bf82f151e8013d39a929aadc41bfcd5c46564866635cee1a02693d2256bf
    container_name: auscult-tdengine
    profiles: ["tdengine"]
    environment:
      - TAOS_FQDN=tdengine
    volumes:
      - tdengine-data:/var/lib/taos
    ports:
      - "6030:6030"   # 原生连接
      - "6041:6041"   # REST / taosAdapter
    networks: [auscult-net]
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  # ---------------- 反向代理：Nginx 1.27（端口 9763） ----------------
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: auscult-nginx
    volumes:
      - ../configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9763:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [auscult-net]
    restart: unless-stopped
    healthcheck:
      # 必须用 127.0.0.1：alpine busybox wget 会把 localhost 优先解析为 IPv6 ::1，
      # 而 nginx 仅监听 IPv4 0.0.0.0:80，用 localhost 会恒判失败（假 negative）
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
      - redis
      - neo4j
